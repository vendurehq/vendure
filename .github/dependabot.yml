version: 2

# Scoping note: Dependabot security updates only raise pull requests for the
# directories declared here. Test fixture manifests — packages/cli/e2e/fixtures
# and packages/dashboard/vite/tests/**/fake_node_modules — are deliberately not
# covered. They declare @vendure/core to exercise the CLI and Vite plugin, are
# never installed, and are never published.
updates:
    # GitHub Actions are pinned by commit SHA. Dependabot updates the pin and
    # the trailing version comment together.
    #
    # These pull requests modify .github/workflows/, which CODEOWNERS requires
    # a listed maintainer to approve, so they are never auto-merged. They are
    # grouped into a single weekly pull request to keep that review to one item.
    - package-ecosystem: github-actions
      directory: /
      schedule:
          interval: weekly
          day: monday
      # Wait a week before proposing a release. A compromised release is
      # usually found and yanked within days, and this only delays version
      # updates — security updates are never held back.
      cooldown:
          default-days: 7
      groups:
          github-actions:
              patterns:
                  - '*'
      commit-message:
          prefix: chore
          include: scope
      labels:
          - 'type: chore 🧤'

    # The docs site is a separate npm project with its own lockfile. It is not
    # published to npm and is not part of the bun workspace.
    - package-ecosystem: npm
      directory: /docs
      schedule:
          interval: weekly
          day: monday
      open-pull-requests-limit: 3
      cooldown:
          semver-patch-days: 7
          semver-minor-days: 7
          semver-major-days: 14
      # Major updates are held back for production dependencies, the same rule
      # the bun workspace entry below applies across the workspace.
      # @vendure-io/docs-provider is the only name this entry needs.
      # @types/node, tsx and typescript are development dependencies and keep
      # offering majors.
      #
      # This is an ignore rule where the bun entry uses an allow list, and the
      # difference is deliberate. An allow list narrows security updates as
      # well as version updates. npm is an ecosystem where Dependabot raises
      # security updates, and the documented default covers every vulnerable
      # dependency in the lock file, transitive ones included. No
      # `dependency-type` names that set for npm — `all` stops at explicitly
      # declared dependencies — so an allow list here would have dropped
      # advisories for anything transitive under @vendure-io/docs-provider.
      # `update-types` under ignore applies to version updates only, so this
      # rule leaves security updates untouched.
      ignore:
          - dependency-name: '@vendure-io/docs-provider'
            update-types:
                - version-update:semver-major
      groups:
          docs:
              patterns:
                  - '*'
              update-types:
                  - minor
                  - patch
      commit-message:
          prefix: chore
          include: scope
      labels:
          - 'type: chore 🧤'
          - 'docs 📖'

    # The root bun workspace covers the published packages under packages/*.
    #
    # Note: Dependabot supports version updates for the bun ecosystem but NOT
    # security updates. Vulnerabilities in these packages will not raise a pull
    # request on their own — they are picked up by the weekly version update if
    # the fix is within range, and otherwise need to be bumped deliberately.
    - package-ecosystem: bun
      directory: /
      schedule:
          interval: weekly
          day: monday
      open-pull-requests-limit: 10
      cooldown:
          default-days: 7
      # These packages are published, so the declared range is part of the
      # public contract. Only widen it when the new version falls outside.
      #
      # bun is not on the documented list of ecosystems supporting this option
      # (bundler, cargo, composer, helm, mix, npm, pip, pub, uv). It is kept
      # anyway: it is either honoured, or ignored, and being ignored leaves the
      # same default behaviour as omitting it. The auto-merge lane does not rely
      # on it either way — every allowlisted dependency is declared as a caret
      # range, so a patch update always falls inside the existing range and no
      # strategy rewrites the manifest.
      versioning-strategy: increase-if-necessary
      # Major updates are raised for development tooling only. A major version
      # of a package that ships to users is a migration for every Vendure
      # project downstream, so it belongs in a planned release.
      #
      # The rule is written as a list of dependency names rather than
      # `dependency-type: development`, for two independent reasons.
      #
      # First, GitHub documents the `dependency-type` values `production` and
      # `development` for bundler, composer, mix, maven, npm, pip and uv. bun
      # is absent. That list differs from the one above for
      # versioning-strategy, because Dependabot documents support per option
      # rather than per ecosystem.
      #
      # Second, the workspace manifests do not split along that line, in either
      # direction. eslint, eslint-config-prettier and the @typescript-eslint
      # packages are production dependencies of the root manifest, typescript
      # and ts-node of packages/cli, @types/express of core and
      # asset-server-plugin, so a rule scoped to development dependencies
      # would block tooling majors. dependabot_auto_merge.yml rejected
      # dependency-type as an auto-merge gate for the same reason.
      #
      # The reverse holds too, which is why this list names tooling rather
      # than every development dependency. bullmq, ioredis, pg, mysql2 and
      # better-sqlite3 are declared as development dependencies here, but
      # plugins peer-depend on them, so a major is a downstream migration.
      #
      # An allow list replaces the default set rather than narrowing it, so the
      # first entry has to restate the default: every dependency gets minor and
      # patch updates. Each entry after it adds majors back for one tooling
      # family. The runtime families — nestjs, graphql, typeorm, opentelemetry
      # and the dashboard packages — are absent on purpose.
      #
      # A tooling package with no entry here stops offering majors, and the
      # symptom is a pull request that never arrives, which nobody notices.
      # When adding a development tool to any manifest, add it here too.
      #
      # ignore beats allow: a dependency matched by both is ignored. The
      # Angular families in the ignore block below therefore stay ignored at
      # every level, and the '*' entry here does not re-enable them.
      #
      # Narrowing the set costs nothing here, because Dependabot raises no
      # security updates for bun at all, as noted above. That is not true of
      # npm, which is why the /docs entry states its rule as an ignore.
      allow:
          - dependency-name: '*'
            update-types:
                - version-update:semver-minor
                - version-update:semver-patch
          - dependency-name: 'typescript'
            update-types:
                - version-update:semver-major
          - dependency-name: '@types/*'
            update-types:
                - version-update:semver-major
          - dependency-name: 'eslint'
            update-types:
                - version-update:semver-major
          - dependency-name: 'eslint-*'
            update-types:
                - version-update:semver-major
          - dependency-name: '@typescript-eslint/*'
            update-types:
                - version-update:semver-major
          - dependency-name: 'prettier'
            update-types:
                - version-update:semver-major
          - dependency-name: 'prettier-*'
            update-types:
                - version-update:semver-major
          - dependency-name: 'vitest'
            update-types:
                - version-update:semver-major
          - dependency-name: '@vitest/*'
            update-types:
                - version-update:semver-major
          - dependency-name: 'rimraf'
            update-types:
                - version-update:semver-major
          - dependency-name: 'concurrently'
            update-types:
                - version-update:semver-major
          - dependency-name: 'cross-env'
            update-types:
                - version-update:semver-major
          - dependency-name: 'ts-node'
            update-types:
                - version-update:semver-major
          # Tooling that belongs to no group above, so a major arrives on its
          # own. @eslint/js and globals are listed because the flat config
          # requires them to move with an eslint major.
          - dependency-name: '@eslint/js'
            update-types:
                - version-update:semver-major
          - dependency-name: 'globals'
            update-types:
                - version-update:semver-major
          - dependency-name: '@commitlint/*'
            update-types:
                - version-update:semver-major
          - dependency-name: 'husky'
            update-types:
                - version-update:semver-major
          - dependency-name: 'lint-staged'
            update-types:
                - version-update:semver-major
          - dependency-name: 'lerna'
            update-types:
                - version-update:semver-major
          - dependency-name: 'conventional-changelog-core'
            update-types:
                - version-update:semver-major
          - dependency-name: '@playwright/test'
            update-types:
                - version-update:semver-major
          - dependency-name: 'playwright'
            update-types:
                - version-update:semver-major
          - dependency-name: 'jsdom'
            update-types:
                - version-update:semver-major
          - dependency-name: 'tinybench'
            update-types:
                - version-update:semver-major
          - dependency-name: 'storybook'
            update-types:
                - version-update:semver-major
          - dependency-name: '@storybook/*'
            update-types:
                - version-update:semver-major
          - dependency-name: '@graphql-codegen/*'
            update-types:
                - version-update:semver-major
          - dependency-name: '@gql.tada/cli-utils'
            update-types:
                - version-update:semver-major
          - dependency-name: '@swc/core'
            update-types:
                - version-update:semver-major
          - dependency-name: 'unplugin-swc'
            update-types:
                - version-update:semver-major
          - dependency-name: 'rollup'
            update-types:
                - version-update:semver-major
          - dependency-name: '@rollup/*'
            update-types:
                - version-update:semver-major
          - dependency-name: 'rollup-plugin-typescript2'
            update-types:
                - version-update:semver-major
          - dependency-name: 'vite-plugin-dts'
            update-types:
                - version-update:semver-major
          - dependency-name: '@typescript/native-preview'
            update-types:
                - version-update:semver-major
      ignore:
          # Workspace-internal packages are versioned by the release process.
          - dependency-name: '@vendure/*'
          # The Angular Admin UI is deprecated in favour of the React dashboard
          # in packages/dashboard, so its toolchain is not worth the review
          # cost. Updates to it are noise in the queue.
          #
          # This entry has to be written as dependency names rather than a
          # path, because this bun entry uses `directory: /` and covers the
          # whole workspace, and Dependabot matches `ignore` on dependency
          # name only. Every family below was checked against every
          # packages/*/package.json and the root manifest: all of them appear
          # only in packages/admin-ui, except @angular/* and @angular-devkit/*,
          # which also appear in packages/ui-devkit. Nothing outside those two
          # packages depends on any of them, so ignoring them workspace-wide
          # does not stop updates for anything that still matters.
          #
          # ui-devkit is covered deliberately. It exists to compile Angular
          # Admin UI extensions, so it shares the Admin UI's deprecation, and
          # scripts/check-angular-versions.ts requires @angular/cli,
          # @angular/compiler and @angular/compiler-cli to match exactly
          # between the two packages. A name-based ignore cannot cover one and
          # not the other in any case.
          - dependency-name: '@angular/*'
          - dependency-name: '@angular-devkit/*'
          - dependency-name: '@angular-eslint/*'
          - dependency-name: '@ngx-translate/*'
          - dependency-name: '@types/jasmine*'
          - dependency-name: 'jasmine*'
          - dependency-name: 'karma*'
          - dependency-name: 'zone.js'
      # Families that must move in lockstep are grouped so they land in one
      # pull request. Groups cover minor and patch only; a major update arrives
      # as its own pull request, because a major is a migration rather than a
      # bump and should not hold a mergeable group hostage.
      groups:
          typescript:
              patterns:
                  - typescript
              update-types:
                  - minor
                  - patch
          types:
              patterns:
                  - '@types/*'
              update-types:
                  - minor
                  - patch
          # Kept separate from dev-tooling because these are the packages the
          # auto-merge workflow allowlists. Grouping them on their own means a
          # group pull request contains only allowlisted names.
          linting:
              patterns:
                  - eslint
                  - eslint-*
                  - '@typescript-eslint/*'
                  - prettier
                  - prettier-*
              update-types:
                  - minor
                  - patch
          dev-tooling:
              patterns:
                  - vitest
                  - '@vitest/*'
                  - rimraf
                  - concurrently
                  - cross-env
                  - ts-node
              update-types:
                  - minor
                  - patch
          nestjs:
              patterns:
                  - '@nestjs/*'
              update-types:
                  - minor
                  - patch
          graphql:
              patterns:
                  - graphql
                  - graphql-*
                  - '@graphql-tools/*'
                  - '@apollo/*'
                  - gql.tada
              update-types:
                  - minor
                  - patch
          typeorm:
              patterns:
                  - typeorm
                  - mysql2
                  - pg
                  - better-sqlite3
                  - sql.js
              update-types:
                  - minor
                  - patch
          opentelemetry:
              patterns:
                  - '@opentelemetry/*'
              update-types:
                  - minor
                  - patch
          dashboard:
              patterns:
                  - react
                  - react-*
                  - '@tanstack/*'
                  - vite
                  - '@vitejs/*'
                  - tailwindcss
                  - '@tailwindcss/*'
                  - tailwind-merge
              update-types:
                  - minor
                  - patch
      commit-message:
          prefix: chore
          include: scope
      labels:
          - 'type: chore 🧤'
