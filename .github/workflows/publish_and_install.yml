name: Publish & Install
on:
    workflow_dispatch:
    push:
        branches:
            - master
            - minor
            - major
        paths:
            - 'packages/**'
            - 'package.json'
            - 'bun.lock'
            - 'bunfig.toml'
    pull_request:
        branches:
            - master
            - major
            - minor
        paths:
            - 'packages/**'
            - 'package.json'
            - 'bun.lock'
            - 'bunfig.toml'

env:
    # CI never fetches the Platform catalog from api.vendure.io. The Dashboard build and the release checks of `bun run release:version` use the committed snapshot.
    VENDURE_DASHBOARD_SKIP_PLATFORM_CATALOG_FETCH: 'true'

defaults:
    run:
        shell: bash

concurrency:
    group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
    cancel-in-progress: true

jobs:
    # Job 1: Build all packages and publish to Verdaccio (runs once)
    build_and_publish:
        runs-on: ubuntu-latest
        timeout-minutes: 30
        permissions:
            contents: read
        steps:
            - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
            - name: Use Node.js 22.x
              uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
              with:
                  node-version: 22.x
            - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
              with:
                  bun-version: '1.4.4'
            - name: Install Verdaccio
              run: |
                  npm install -g verdaccio
                  npm install -g wait-on
                  mkdir -p $HOME/.config/verdaccio
                  cp -v ./.github/workflows/verdaccio/config.yaml $HOME/.config/verdaccio/config.yaml
                  nohup verdaccio --config $HOME/.config/verdaccio/config.yaml &
                  wait-on http://localhost:4873
                  TOKEN_RES=$(curl -XPUT \
                    -H "Content-type: application/json" \
                    -d '{ "name": "test", "password": "test" }' \
                    'http://localhost:4873/-/user/org.couchdb.user:test')
                  TOKEN=$(echo "$TOKEN_RES" | jq -r '.token')
                  npm set //localhost:4873/:_authToken $TOKEN
            - name: bun install
              run: bun install --frozen-lockfile
              env:
                  CI: true
            - name: Publish to Verdaccio
              run: |
                  nohup verdaccio --config $HOME/.config/verdaccio/config.yaml &
                  wait-on http://localhost:4873
                  bun run release:version prepatch --preid ci --skip-git
                  for dir in $(node .github/workflows/scripts/public-package-dirs.js); do
                    (
                      cd "$dir"
                      publish_dir=$(node -p "require('./package.json').publishConfig?.directory || '.'")
                      cd "$publish_dir"
                      npm publish --ignore-scripts --tag ci --registry http://localhost:4873
                    )
                  done
            - name: Package Verdaccio storage
              run: |
                  cd $HOME/.config/verdaccio
                  tar -czf verdaccio-storage.tar.gz storage htpasswd
            - name: Upload Verdaccio storage
              uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
              with:
                  name: verdaccio-storage
                  path: ~/.config/verdaccio/verdaccio-storage.tar.gz
                  retention-days: 1

    # Job 2: Test installation on various OS/Node combinations
    test:
        needs: build_and_publish
        runs-on: ${{ matrix.os }}
        timeout-minutes: 45
        permissions:
            contents: read
        strategy:
            matrix:
                # For PRs: run minimal matrix (1 job). For push: run full matrix (9 jobs).
                # Only non-EOL Node versions are tested: native deps (e.g. better-sqlite3)
                # stop publishing prebuilt binaries for EOL versions, and the node-gyp
                # bundled with an EOL Node cannot drive newer Visual Studio releases.
                os: ${{ github.event_name == 'pull_request' && fromJSON('["ubuntu-latest"]') || fromJSON('["ubuntu-latest", "windows-latest", "macos-latest"]') }}
                node-version: ${{ github.event_name == 'pull_request' && fromJSON('["22.x"]') || fromJSON('["22.x", "24.x", "26.x"]') }}
            fail-fast: false
        steps:
            - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
            - name: Use Node.js ${{ matrix.node-version }}
              uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
              with:
                  node-version: ${{ matrix.node-version }}
            - name: Download Verdaccio storage
              uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
              with:
                  name: verdaccio-storage
                  path: ~/verdaccio-download
            - name: Setup Verdaccio with pre-built packages
              run: |
                  npm install -g verdaccio
                  npm install -g wait-on
                  mkdir -p $HOME/.config/verdaccio
                  cp -v ./.github/workflows/verdaccio/config.yaml $HOME/.config/verdaccio/config.yaml
                  # Extract the pre-built storage
                  cd $HOME/.config/verdaccio
                  tar -xzf ~/verdaccio-download/verdaccio-storage.tar.gz
                  # Start Verdaccio
                  nohup verdaccio --config $HOME/.config/verdaccio/config.yaml &
                  wait-on http://localhost:4873
                  # Setup auth token
                  TOKEN_RES=$(curl -XPUT \
                    -H "Content-type: application/json" \
                    -d '{ "name": "test", "password": "test" }' \
                    'http://localhost:4873/-/user/org.couchdb.user:test')
                  TOKEN=$(echo "$TOKEN_RES" | jq -r '.token')
                  npm set //localhost:4873/:_authToken $TOKEN
            - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
              with:
                  bun-version: '1.4.4'
            # `@vendure/create` writes a Vendure Cloud app, which needs Docker and the Cloud
            # runtime to start. The smoke and Dashboard tests run against a self-hosted fixture
            # app instead, installed from the packages published to Verdaccio.
            - name: Install the self-hosted test app
              run: |
                  mkdir -p $HOME/install
                  cd $HOME/install
                  nohup verdaccio --config $HOME/.config/verdaccio/config.yaml &
                  wait-on http://localhost:4873
                  npm set registry=http://localhost:4873
                  VENDURE_VERSION=$(npm view @vendure/core@ci version)
                  echo "Resolved @vendure/core@ci -> $VENDURE_VERSION"
                  node $GITHUB_WORKSPACE/.github/workflows/scripts/install-test-app.js "$GITHUB_WORKSPACE" test-app "$VENDURE_VERSION"
                  cd test-app
                  npm install --loglevel error
                  # The sample data of the repository's e2e tests, whose initial data is TypeScript.
                  bun "$GITHUB_WORKSPACE/.github/workflows/scripts/write-initial-data.ts" initial-data.json
                  MOCK_DATA_DIR="$GITHUB_WORKSPACE/packages/core/mock-data" npm run populate
            - name: Create a project with @vendure/create
              env:
                  GIT_AUTHOR_NAME: CI
                  GIT_AUTHOR_EMAIL: ci@example.com
                  GIT_COMMITTER_NAME: CI
                  GIT_COMMITTER_EMAIL: ci@example.com
              run: |
                  cd $HOME/install
                  npx @vendure/create@ci created-app --yes --json --no-install > create-result.json
                  node $GITHUB_WORKSPACE/.github/workflows/scripts/check-create-result.js create-result.json npm
            - name: Server smoke tests
              run: |
                  cd $HOME/install/test-app
                  npm run dev &
                  node $GITHUB_WORKSPACE/.github/workflows/scripts/smoke-tests
            # Both steps below free ports 3000 (server) and 5173 (dashboard Vite) so that the
            # dashboard tests start a fresh `npm run dev`. If either port is still bound, the
            # tests run against the smoke-test server, which predates the test plugin, and fail
            # with "Test component not found". So each step waits for both ports to be free,
            # and fails here if they are not.
            - name: Kill dev server after smoke tests (Unix)
              if: runner.os != 'Windows'
              run: |
                  # `kill` sends SIGTERM. `vendure dev` treats a child which exits by a signal as
                  # stopped on purpose, so it does not restart the server or the dashboard.
                  lsof -ti:3000,5173 | xargs kill 2>/dev/null || true
                  for i in $(seq 30); do
                      lsof -ti:3000,5173 >/dev/null || { echo "Ports 3000 and 5173 are free"; exit 0; }
                      sleep 1
                  done
                  lsof -i:3000,5173
                  echo "::error::Ports 3000 and 5173 are still in use"
                  exit 1
            - name: Kill dev server after smoke tests (Windows)
              if: runner.os == 'Windows'
              shell: pwsh
              run: |
                  # Windows has no signals: `taskkill /F` ends a process with exit code 1.
                  # `vendure dev` treats a non-zero exit without a signal as a crash, and restarts
                  # that child on the next file change. The next step copies the test plugin into
                  # src/, so killing only the processes on the two ports lets `vendure dev` start
                  # them again. Kill the process tree of everything started from the test app,
                  # which includes the `vendure dev` supervisor.
                  $appDir = (Join-Path $HOME 'install\test-app').ToLowerInvariant()
                  Get-CimInstance Win32_Process |
                      Where-Object { $_.ProcessId -ne $PID -and $_.CommandLine -and $_.CommandLine.Replace('/', '\').ToLowerInvariant().Contains($appDir) } |
                      ForEach-Object {
                          Write-Host "Killing process tree $($_.ProcessId): $($_.CommandLine)"
                          taskkill /F /T /PID $_.ProcessId 2>&1 | Out-Null
                      }
                  # A server child started with a relative path does not match the test app
                  # directory. Kill whatever still holds the ports.
                  $ports = 3000, 5173
                  for ($i = 0; $i -lt 30; $i++) {
                      $listeners = Get-NetTCPConnection -State Listen -ErrorAction SilentlyContinue | Where-Object { $ports -contains $_.LocalPort }
                      if (-not $listeners) { Write-Host "Ports 3000 and 5173 are free"; exit 0 }
                      $listeners | Select-Object -ExpandProperty OwningProcess -Unique | ForEach-Object {
                          Write-Host "Killing process tree $_, which listens on port 3000 or 5173"
                          taskkill /F /T /PID $_ 2>&1 | Out-Null
                      }
                      Start-Sleep -Seconds 1
                  }
                  Get-NetTCPConnection -State Listen | Where-Object { $ports -contains $_.LocalPort } | Format-Table -AutoSize
                  Write-Host "::error::Ports 3000 and 5173 are still in use"
                  exit 1
            - name: Copy files (Windows)
              if: runner.os == 'Windows'
              shell: pwsh
              run: |
                cd ~/install/test-app
                New-Item -ItemType Directory -Force -Path src/plugins/test-plugin
                Copy-Item "$env:GITHUB_WORKSPACE/.github/workflows/scripts/test-plugin/*" -Destination "src/plugins/test-plugin/" -Recurse -Force
                Copy-Item "$env:GITHUB_WORKSPACE/.github/workflows/scripts/setup-test-plugin.js" -Destination "./setup-test-plugin.js"
            - name: Copy files (Unix)
              if: runner.os != 'Windows'
              run: |
                cd ~/install/test-app
                mkdir -p src/plugins/test-plugin
                cp -r "$GITHUB_WORKSPACE/.github/workflows/scripts/test-plugin/." src/plugins/test-plugin/
                cp "$GITHUB_WORKSPACE/.github/workflows/scripts/setup-test-plugin.js" ./setup-test-plugin.js
            - name: Run setup script
              shell: bash
              run: |
                cd ~/install/test-app
                node setup-test-plugin.js
            - name: Cache Playwright browsers
              uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
              with:
                  path: ~/.cache/ms-playwright
                  key: playwright-${{ runner.os }}-${{ hashFiles('**/bun.lock') }}
                  restore-keys: |
                      playwright-${{ runner.os }}-
            - name: Install Playwright
              run: |
                  cd ~/install/test-app
                  npm install --no-save playwright
                  npx playwright install chromium
                  npx playwright install-deps chromium
            - name: Start dashboard and run tests
              run: |
                cd ~/install/test-app
                # `npm run dev` already starts BOTH the Vendure server (port 3000) and the
                # dashboard Vite dev server (port 5173) concurrently. Starting a second Vite
                # on 5173 here caused an intermittent EADDRINUSE race against the one that
                # `npm run dev` had already bound, so we rely on the single dev process.
                npm run dev &
                DEV_PID=$!
                # Wait for the server (use /health endpoint, not root) and the dashboard to be available
                wait-on http://localhost:3000/health --timeout 60000
                wait-on http://localhost:5173/dashboard --timeout 120000
                # Run the dashboard tests
                NODE_PATH=~/install/test-app/node_modules node $GITHUB_WORKSPACE/.github/workflows/scripts/dashboard-tests.js
                # Clean up dev server process
                kill $DEV_PID 2>/dev/null || true
            - name: Upload dashboard test screenshots
              if: always()
              uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
              with:
                name: dashboard-test-screenshots-${{ matrix.os }}-${{ matrix.node-version }}
                path: /tmp/dashboard-test-*.png
                retention-days: 28

    # Job 3: Verify `@vendure/create` works when invoked via bun, pnpm and yarn.
    # The package manager is detected from npm_config_user_agent (which bunx / pnpm dlx /
    # yarn dlx set), so the generated project must use that manager rather than
    # hard-coding npm (#4390). pnpm and yarn are deliberately NOT pinned: their current
    # releases are what users get, and policy changes in new majors (e.g. pnpm 11 ignoring
    # the package.json pnpm field, yarn 4.14 disabling build scripts) must fail here (#4932).
    test_package_managers:
        needs: build_and_publish
        runs-on: ubuntu-latest
        timeout-minutes: 30
        permissions:
            contents: read
        strategy:
            matrix:
                include:
                    # $CREATE_VERSION is resolved from the ci dist-tag at run time. The tag
                    # itself is not passed to dlx because Verdaccio serves pnpm's abbreviated
                    # metadata requests a stale/merged tag map, resolving @ci to an upstream
                    # nightly instead of the locally published version.
                    - pm: bun
                      scaffold: bunx @vendure/create@$CREATE_VERSION test-app --yes --json --no-install > $HOME/install/create-result.json
                    - pm: pnpm
                      scaffold: pnpm dlx @vendure/create@$CREATE_VERSION test-app --yes --json --no-install > $HOME/install/create-result.json
                    - pm: yarn
                      scaffold: yarn dlx @vendure/create@$CREATE_VERSION test-app --yes --json --no-install > $HOME/install/create-result.json
            fail-fast: false
        steps:
            - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
            - name: Use Node.js 22.x
              uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
              with:
                  node-version: 22.x
            - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
              with:
                  bun-version: '1.4.4'
            - name: Enable pnpm and yarn via corepack
              run: |
                  # The runner's bundled corepack maps yarn@stable to an outdated release;
                  # updating corepack first gives the current one that users actually get.
                  npm install -g corepack@latest
                  corepack enable
                  corepack prepare pnpm@latest --activate
                  corepack prepare yarn@stable --activate
                  pnpm --version
                  yarn --version
            - name: Download Verdaccio storage
              uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
              with:
                  name: verdaccio-storage
                  path: ~/verdaccio-download
            - name: Setup Verdaccio with pre-built packages
              run: |
                  npm install -g verdaccio
                  npm install -g wait-on
                  mkdir -p $HOME/.config/verdaccio
                  cp -v ./.github/workflows/verdaccio/config.yaml $HOME/.config/verdaccio/config.yaml
                  cd $HOME/.config/verdaccio
                  tar -xzf ~/verdaccio-download/verdaccio-storage.tar.gz
                  nohup verdaccio --config $HOME/.config/verdaccio/config.yaml &
                  wait-on http://localhost:4873
                  # Register a Verdaccio user and capture an auth token.
                  TOKEN_RES=$(curl -XPUT \
                    -H "Content-type: application/json" \
                    -d '{ "name": "test", "password": "test" }' \
                    'http://localhost:4873/-/user/org.couchdb.user:test')
                  TOKEN=$(echo "$TOKEN_RES" | jq -r '.token')
                  # npm + pnpm read ~/.npmrc; bun is pointed at Verdaccio via the
                  # npm_config_registry env var on the install step (see below).
                  npm set registry=http://localhost:4873
                  npm set //localhost:4873/:_authToken $TOKEN
            - name: Create a project with @vendure/create using ${{ matrix.pm }}
              # bun ignores the home-directory ~/.npmrc (oven-sh/bun#22971) and does not walk
              # up to a parent .npmrc/bunfig, but it DOES honour the npm_config_registry env
              # var — and so does the scaffolded project's nested install (it inherits the
              # env). This is the one mechanism that reaches both bunx and the nested install.
              # Yarn Berry reads neither ~/.npmrc nor npm_config_registry: it needs its own
              # YARN_NPM_REGISTRY_SERVER env var, plus the http whitelist since Verdaccio
              # is plain http.
              env:
                  CI: true
                  npm_config_registry: http://localhost:4873/
                  YARN_NPM_REGISTRY_SERVER: http://localhost:4873/
                  YARN_UNSAFE_HTTP_WHITELIST: localhost
                  # Yarn quarantines versions published less than npmMinimalAgeGate ago
                  # (default 1d, YN0016) — the packages under test are seconds old.
                  YARN_NPM_MINIMAL_AGE_GATE: 0
                  GIT_AUTHOR_NAME: CI
                  GIT_AUTHOR_EMAIL: ci@example.com
                  GIT_COMMITTER_NAME: CI
                  GIT_COMMITTER_EMAIL: ci@example.com
              run: |
                  mkdir -p $HOME/install
                  cd $HOME/install
                  npm dist-tag ls @vendure/create
                  CREATE_VERSION=$(npm view @vendure/create@ci version)
                  echo "Resolved @vendure/create@ci -> $CREATE_VERSION"
                  # No --package-manager: the manager is detected from the invoking bunx / pnpm dlx.
                  ${{ matrix.scaffold }}
            - name: Check the created project
              run: |
                  node $GITHUB_WORKSPACE/.github/workflows/scripts/check-create-result.js $HOME/install/create-result.json ${{ matrix.pm }}

    # Job 4: Run the self-hosted test app from a path that contains a space, and create a
    # project with a storefront.
    test_path_with_space:
        needs: build_and_publish
        runs-on: ubuntu-latest
        timeout-minutes: 45
        permissions:
            contents: read
        steps:
            - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
            - name: Use Node.js 22.x
              uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
              with:
                  node-version: 22.x
            - name: Download Verdaccio storage
              uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
              with:
                  name: verdaccio-storage
                  path: ~/verdaccio-download
            - name: Setup Verdaccio with pre-built packages
              run: |
                  npm install -g verdaccio
                  npm install -g wait-on
                  mkdir -p $HOME/.config/verdaccio
                  cp -v ./.github/workflows/verdaccio/config.yaml $HOME/.config/verdaccio/config.yaml
                  cd $HOME/.config/verdaccio
                  tar -xzf ~/verdaccio-download/verdaccio-storage.tar.gz
                  nohup verdaccio --config $HOME/.config/verdaccio/config.yaml &
                  wait-on http://localhost:4873
                  TOKEN_RES=$(curl -XPUT \
                    -H "Content-type: application/json" \
                    -d '{ "name": "test", "password": "test" }' \
                    'http://localhost:4873/-/user/org.couchdb.user:test')
                  TOKEN=$(echo "$TOKEN_RES" | jq -r '.token')
                  npm set registry=http://localhost:4873
                  npm set //localhost:4873/:_authToken $TOKEN
            # The install directory deliberately contains a space: file URLs percent-encode
            # it (%20), which used to leak into filesystem paths in the dashboard's vite
            # plugins and break `npm run dev` (#4931).
            - name: Install the self-hosted test app in a path containing a space
              timeout-minutes: 15
              run: |
                  mkdir -p "$HOME/install dir"
                  cd "$HOME/install dir"
                  VENDURE_VERSION=$(npm view @vendure/core@ci version)
                  node "$GITHUB_WORKSPACE/.github/workflows/scripts/install-test-app.js" "$GITHUB_WORKSPACE" test-app "$VENDURE_VERSION"
                  cd test-app
                  npm install --loglevel error
            - name: Dev server smoke test from a path containing a space
              timeout-minutes: 15
              run: |
                  cd "$HOME/install dir/test-app"
                  npm run dev &
                  wait-on http://localhost:3000/health --timeout 120000
                  # The dashboard Vite server failed to start when the project path
                  # percent-encoded (#4931), so it becoming reachable is the regression check.
                  wait-on http://localhost:5173/dashboard --timeout 180000
                  lsof -ti:3000,5173 | xargs kill 2>/dev/null || true
            - name: Create a project with a storefront
              timeout-minutes: 15
              env:
                  GITHUB_TOKEN: ${{ github.token }}
                  GIT_AUTHOR_NAME: CI
                  GIT_AUTHOR_EMAIL: ci@example.com
                  GIT_COMMITTER_NAME: CI
                  GIT_COMMITTER_EMAIL: ci@example.com
              run: |
                  cd "$HOME/install dir"
                  npx @vendure/create@ci shop-mono --yes --json --no-install --storefront nextjs > create-result.json
                  node "$GITHUB_WORKSPACE/.github/workflows/scripts/check-create-result.js" create-result.json npm nextjs
