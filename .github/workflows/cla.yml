name: CLA

# Checks that everyone who has to sign the Contributor License Agreement for a pull request has
# signed it. See cla_check.yml for the rules and how signatures are stored.
on:
    issue_comment:
        types: [created]
    pull_request_target:
        types: [opened, reopened, synchronize, closed]

permissions: {}

jobs:
    cla:
        uses: ./.github/workflows/cla_check.yml
        # The token for the signatures file, the status and the comment comes from the CI bot app.
        # This permission is only for checking out the workflow's own scripts.
        permissions:
            contents: read
        secrets: inherit
