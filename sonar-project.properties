sonar.projectKey=vendurehq_vendure
sonar.organization=vendurehq

# jssecurity:S8707 flags a path built from a command-line argument. It applies to
# code that takes a path from an untrusted caller, but everything under scripts/
# is developer tooling in this private, unpublished package: the only caller is
# the developer running the script, and the argument is a path they chose. The
# scripts still reject paths outside the repository, but that check is a
# containment guard rather than a sanitizer the rule recognises, so scope the
# rule off this directory rather than reshaping the tooling around it.
sonar.issue.ignore.multicriteria=e1,e2,e3,e4,e5,e6,e7
sonar.issue.ignore.multicriteria.e1.ruleKey=jssecurity:S8707
sonar.issue.ignore.multicriteria.e1.resourceKey=scripts/**/*
sonar.issue.ignore.multicriteria.e2.ruleKey=tssecurity:S8707
sonar.issue.ignore.multicriteria.e2.resourceKey=packages/common/scripts/**/*

# typescript:S5332 flags the nodemailer createTransport() calls of the email sender as
# using plain http. They pass through the transport the project configures: SMTP on
# port 587 sets `secure: false` and upgrades with STARTTLS, so forcing TLS would break
# valid configurations.
sonar.issue.ignore.multicriteria.e3.ruleKey=typescript:S5332
sonar.issue.ignore.multicriteria.e3.resourceKey=packages/email/src/sender/**/*

# Email clients need table layouts and role="presentation" tables: they ignore CSS
# layout (flexbox, grid) and screen readers must not announce layout tables as data.
sonar.issue.ignore.multicriteria.e4.ruleKey=typescript:S5257
sonar.issue.ignore.multicriteria.e4.resourceKey=packages/email/src/components/**/*
sonar.issue.ignore.multicriteria.e5.ruleKey=typescript:S6819
sonar.issue.ignore.multicriteria.e5.resourceKey=packages/email/src/components/**/*

# @vendure/email-plugin is deprecated as a whole and frozen until its removal in v5.
# Its own files use the deprecated EmailPlugin class.
sonar.issue.ignore.multicriteria.e6.ruleKey=typescript:S1874
sonar.issue.ignore.multicriteria.e6.resourceKey=packages/email-plugin/**/*

# typescript:S4036 asks for commands to be run from fixed, unwriteable directories.
# @vendure/create runs `docker` and the user's package manager, which are installed
# in different places on every machine, so it has to find them on the user's PATH.
sonar.issue.ignore.multicriteria.e7.ruleKey=typescript:S4036
sonar.issue.ignore.multicriteria.e7.resourceKey=packages/create/src/helpers.ts

# Generated catalog data. It repeats the same object shape for each capability.
# @vendure/email-plugin is frozen until its removal in v5. @vendure/email copies its
# transport layer on purpose, so that the frozen package does not depend on the new one.
sonar.cpd.exclusions=packages/common/src/platform-promotion-snapshot.ts,packages/email-plugin/**/*
