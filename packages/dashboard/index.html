<!doctype html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/favicon.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Vendure Admin Dashboard" />
    <meta name="author" content="Vendure" />
    <!--
        The saved theme before the first paint: the theme in the user settings, else the system
        setting. ThemeProvider sets the same class once the app runs. Without it a dark-theme
        reload paints light first. The key is LS_KEY_USER_SETTINGS in src/lib/storage-keys.ts.
    -->
    <script>
        (function () {
            var theme;
            try {
                theme = JSON.parse(localStorage.getItem('vendure-user-settings') || '{}').theme;
            } catch (e) {}
            var dark =
                theme === 'dark' ||
                (theme !== 'light' && window.matchMedia('(prefers-color-scheme: dark)').matches);
            document.documentElement.classList.add(dark ? 'dark' : 'light');
        })();
    </script>
    <!--
        The boot screen shows until the router has rendered the first page (main.tsx removes it).
        The stylesheet loads with the app, so the colours come from a style that the theme Vite
        plugin adds to this head.
    -->
    <style>
        html {
            background-color: var(--background);
        }
        #boot-splash {
            position: fixed;
            inset: 0;
            z-index: 50;
            display: flex;
            align-items: center;
            justify-content: center;
            background-color: var(--background);
            color: var(--muted-foreground);
        }
        #boot-splash svg {
            width: 16px;
            height: 16px;
            animation: boot-splash-spin 1s linear infinite;
        }
        @media (prefers-reduced-motion: reduce) {
            #boot-splash svg {
                animation: none;
            }
        }
        @keyframes boot-splash-spin {
            to {
                transform: rotate(360deg);
            }
        }
    </style>
</head>
<body>
<div id="app"></div>
<div id="boot-splash" role="status" aria-label="Loading">
    <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M21 12a9 9 0 1 1-6.219-8.56" /></svg>
</div>
<script type="module" src="/src/app/main.tsx"></script>
</body>
</html>
