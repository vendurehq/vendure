type Product implements Node {
    channels: [Channel!]!
    """
    Whether the Product is enabled in the active Channel. It is available in the Channel only if it is
    also enabled globally (`enabled`).
    """
    enabledInChannel: Boolean!
}

type ProductVariantPrice {
    currencyCode: CurrencyCode!
    price: Money!
}

type ProductVariant implements Node {
    enabled: Boolean!
    """
    Whether the ProductVariant is enabled in the active Channel. It is available in the Channel only if it is
    also enabled globally (`enabled`).
    """
    enabledInChannel: Boolean!
    trackInventory: GlobalFlag!
    """
    Whether stock limits apply to this ProductVariant in the active Channel: false when any
    StockLevel the StockLocationStrategy counts does not track inventory, so the variant can be
    sold and fulfilled without limit.
    """
    tracksInventory: Boolean!
    """
    The total stock on hand, as reported by the configured StockLocationStrategy. By default this
    is the sum over all StockLevels; the MultiChannelStockLocationStrategy counts only the
    StockLocations of the active Channel. Use `stockLevels` for the per-location values.
    """
    stockOnHand: Int!
    """
    The total allocated stock, counted in the same way as `stockOnHand`.
    """
    stockAllocated: Int!
    outOfStockThreshold: Int!
    useGlobalOutOfStockThreshold: Boolean!
    prices: [ProductVariantPrice!]!
    stockLevels: [StockLevel!]!
    stockMovements(options: StockMovementListOptions): StockMovementList!
    channels: [Channel!]!
}
