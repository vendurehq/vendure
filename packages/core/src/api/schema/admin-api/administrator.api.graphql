type Query {
    administrators(options: AdministratorListOptions): AdministratorList!
    administrator(id: ID!): Administrator
    activeAdministrator: Administrator
}

type Mutation {
    "Create a new Administrator"
    createAdministrator(input: CreateAdministratorInput!): Administrator!
    "Update an existing Administrator"
    updateAdministrator(input: UpdateAdministratorInput!): Administrator!
    "Update the active (currently logged-in) Administrator"
    updateActiveAdministrator(input: UpdateActiveAdministratorInput!): Administrator!
    "Delete an Administrator"
    deleteAdministrator(id: ID!): DeletionResponse!
    "Delete multiple Administrators"
    deleteAdministrators(ids: [ID!]!): [DeletionResponse!]!
    "Assign a Role to an Administrator"
    assignRoleToAdministrator(administratorId: ID!, roleId: ID!): Administrator!
        @deprecated(
            reason: "Use setRoleAssignmentsForUser instead. assignRoleToAdministrator assigns the Role on the active Channel only."
        )
}

# generated by generateListOptions function
input AdministratorListOptions

input CreateAdministratorInput {
    firstName: String!
    lastName: String!
    emailAddress: String!
    password: String!
    "Grants the Roles on the active Channel. Cannot be combined with roleAssignments."
    roleIds: [ID!]
        @deprecated(
            reason: "Use roleAssignments instead. roleIds grants the Roles on the active Channel only."
        )
    "The RoleAssignments to create for the new Administrator's User. Cannot be combined with roleIds."
    roleAssignments: [RoleAssignmentInput!]
}

input UpdateAdministratorInput {
    id: ID!
    firstName: String
    lastName: String
    emailAddress: String
    password: String
    "Replaces the User's Roles on the active Channel. Cannot be combined with roleAssignments."
    roleIds: [ID!]
        @deprecated(
            reason: "Use roleAssignments instead. roleIds replaces the Roles on the active Channel only."
        )
    "Replaces the full set of the User's RoleAssignments across all Channels. Cannot be combined with roleIds."
    roleAssignments: [RoleAssignmentInput!]
}

input UpdateActiveAdministratorInput {
    firstName: String
    lastName: String
    emailAddress: String
    password: String
}
