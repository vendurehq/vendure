type Query {
    administrators(options: AdministratorListOptions): AdministratorList!
    administrator(id: ID!): Administrator
    activeAdministrator: Administrator
}

type Mutation {
    "Create a new Administrator"
    createAdministrator(input: CreateAdministratorInput!): Administrator!
    "Update an existing Administrator"
    updateAdministrator(input: UpdateAdministratorInput!): Administrator!
    "Update the active (currently logged-in) Administrator"
    updateActiveAdministrator(input: UpdateActiveAdministratorInput!): Administrator!
    "Upload, replace or remove the active Administrator's profile picture"
    setActiveAdministratorAvatar(file: Upload): Administrator!
    "Delete an Administrator"
    deleteAdministrator(id: ID!): DeletionResponse!
    "Delete multiple Administrators"
    deleteAdministrators(ids: [ID!]!): [DeletionResponse!]!
    "Assign a Role to an Administrator"
    assignRoleToAdministrator(administratorId: ID!, roleId: ID!): Administrator!
}

# generated by generateListOptions function
input AdministratorListOptions

"""
Grants the Permissions of a Role to an Administrator on the given Channels only.

Requires the `authOptions.channelScopedRoles` config option to be enabled.
"""
input ChannelRoleInput {
    roleId: ID!
    channelIds: [ID!]!
}

input CreateAdministratorInput {
    firstName: String!
    lastName: String!
    emailAddress: String!
    password: String!
    """
    Roles which apply on every Channel they are assigned to. When `authOptions.channelScopedRoles` is
    enabled, a Role may only be listed here if it is assigned to every Channel.
    """
    roleIds: [ID!]!
    "Channel-scoped Role assignments. Requires `authOptions.channelScopedRoles` to be enabled."
    channelRoles: [ChannelRoleInput!]
}

input UpdateAdministratorInput {
    id: ID!
    firstName: String
    lastName: String
    emailAddress: String
    password: String
    """
    Roles which apply on every Channel they are assigned to. When `authOptions.channelScopedRoles` is
    enabled, a Role may only be listed here if it is assigned to every Channel.
    """
    roleIds: [ID!]
    "Channel-scoped Role assignments. Requires `authOptions.channelScopedRoles` to be enabled."
    channelRoles: [ChannelRoleInput!]
}

input UpdateActiveAdministratorInput {
    firstName: String
    lastName: String
    emailAddress: String
    password: String
}
