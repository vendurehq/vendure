type Query {
  taxRates(options: TaxRateListOptions): TaxRateList!
  taxRate(id: ID!): TaxRate
}

type Mutation {
  "Create a new TaxRate"
  createTaxRate(input: CreateTaxRateInput!): TaxRate!
  "Update an existing TaxRate"
  updateTaxRate(input: UpdateTaxRateInput!): TaxRate!
  "Delete a TaxRate"
  deleteTaxRate(id: ID!): DeletionResponse!
  "Delete multiple TaxRates"
  deleteTaxRates(ids: [ID!]!): [DeletionResponse!]!
}

input TaxRateFilterParameter {
    zoneId: IDOperators
    regionId: IDOperators
    categoryId: IDOperators
}

# generated by generateListOptions function
input TaxRateListOptions

input CreateTaxRateInput {
    name: String!
    enabled: Boolean!
    value: Float!
    categoryId: ID!
    "The Zone the rate applies to. Exactly one of zoneId and regionId must be set."
    zoneId: ID
    "The Country the rate applies to. Exactly one of zoneId and regionId must be set."
    regionId: ID
    customerGroupId: ID
}

input UpdateTaxRateInput {
    id: ID!
    name: String
    value: Float
    enabled: Boolean
    categoryId: ID
    "The Zone the rate applies to. Setting it removes the Country."
    zoneId: ID
    "The Country the rate applies to. Setting it removes the Zone."
    regionId: ID
    customerGroupId: ID
}
