type Query {
    roles(options: RoleListOptions): RoleList!
    role(id: ID!): Role
}

type Mutation {
    "Create a new Role"
    createRole(input: CreateRoleInput!): Role!
    "Update an existing Role"
    updateRole(input: UpdateRoleInput!): Role!
    "Delete an existing Role"
    deleteRole(id: ID!): DeletionResponse!
    "Delete multiple Roles"
    deleteRoles(ids: [ID!]!): [DeletionResponse!]!
}

# generated by generateListOptions function
input RoleListOptions

input CreateRoleInput {
    code: String!
    description: String!
    permissions: [Permission!]!
}

input UpdateRoleInput {
    id: ID!
    code: String
    description: String
    permissions: [Permission!]
}

extend type Role {
    """
    The Channel which owns this Role. A Role owned by the default Channel can be assigned on any
    Channel, any other Role only on its owner. Null only for a Role created by a v3 server during
    a rolling upgrade, until the role assignment migration has completed.
    """
    channel: Channel
}
