type TaxRate implements Node {
    id: ID!
    createdAt: DateTime!
    updatedAt: DateTime!
    name: String!
    enabled: Boolean!
    value: Float!
    category: TaxCategory!
    zone: Zone
    region: Region
    customerGroup: CustomerGroup
}

type TaxRateList implements PaginatedList {
    items: [TaxRate!]!
    totalItems: Int!
}
