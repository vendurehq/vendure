packages:
  - packages/*

# pnpm 10+ 将该设置从 .npmrc 迁移至此：允许依赖声明用精确版本时自动链接 workspace 包
# （@vendure/* 插件均为私有包，registry 上不存在，必须走 workspace 链接）
linkWorkspacePackages: true

# 把所有已安装依赖提升到根 node_modules（dev-config 顶层 require 的 @nestjs/* 等历史依赖
# 未在 dev-server 显式声明，靠提升解析；过滤安装后布局与历史 hybrid 布局兼容）
shamefullyHoist: true

# 关闭 peer 自动安装：跨插件 peer（如 inventory-plugin peer shop-plugin）全部由
# dev-server 的显式依赖满足；否则 lockfile-only 全仓解析时 peer 会被送去 registry
# 解析，私有包 404 + 无限重试导致卡死
autoInstallPeers: false

# pnpm 11 从 pnpm-workspace.yaml 读取 overrides（package.json 的 pnpm.overrides 被忽略）。
# stitch 钉在 range 下限 10.1.16：其 10.3.x 新版需要 batch-delegate@^10.1.1 / delegate@^12.2.1，
# npmmirror 尚未同步这两个版本（只有 10.1.0 / 12.2.0）
overrides:
  '@graphql-tools/stitch': 10.1.16
  # DI 单实例化：pnpm 严格隔离下多版本并存导致 NestJS DI token 分裂（DataSource 注入失败、
  # GraphQL 装饰器元数据分裂），钉成全仓单版本
  'typeorm': 0.3.31
  '@nestjs/graphql': 13.1.0
  'rxjs': 7.8.2
  # 连带钉死 typeorm 的 optional peer，否则同版本 typeorm 会按 peer 组合裂成多实例
  # （DataSource 类身份分裂，DI 依旧报错）
  'ioredis': 5.11.1
  'sql.js': 1.14.1
  '@types/node': 20.19.43

allowBuilds:
  '@swc/core': true
  esbuild: true
  husky: true
  nx: true
  better-sqlite3: true
